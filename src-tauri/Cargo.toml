[package]
name = "fio"
version = "0.1.0"
description = "Virtual audio patchbay for PipeWire/PulseAudio, Loopback for Linux"
authors = ["Eduardo Fabisiak <fabisiakeduardo@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libpulse-binding = "2"
# Same crate libpulse-binding links against; used for the single
# `pa_threaded_mainloop_signal` FFI call the introspection callbacks need.
libpulse-sys = "1.22"
tauri-plugin-autostart = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
